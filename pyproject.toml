[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-robo-harness"
version = "0.1.0a1"
description = "Open execution and evaluation harness for reasoning-driven robotics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "StarRoboHarness contributors"}]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
rollout = [
  "pillow>=10",
  "msgpack>=1",
  "websockets>=15",
  "opencv-python-headless>=4.8",
  "scipy>=1.10",
]
persistent = ["imageio>=2", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hybrid_rollout.robodojo" = ["eval_panels/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/hybrid_rollout"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
