  .title{font-family:Arial,sans-serif;font-weight:700;fill:#1d2b3a}.sub{font-family:Arial,sans-serif;font-weight:400;fill:#5a6a79}.head{font-family:Arial,sans-serif;font-weight:700;fill:#1d2b3a}.body{font-family:Arial,sans-serif;font-weight:400;fill:#5a6a79}.small{font-family:Arial,sans-serif;font-weight:400;fill:#5a6a79}.box{stroke-width:2}
